name: mobile-release

# Build a debug Android APK on every push to main and a release-signed APK
# whenever a v* tag is pushed. The release APK is uploaded as an artefact and
# attached to the GitHub Release matching the tag.
#
# The `release` job also runs via `workflow_call` (invoked by release-please.yml
# right after it creates a release — its GITHUB_TOKEN-made tag never fires
# `on: push: tags`) and via manual `workflow_dispatch`. In both cases the tag is
# taken from the `tag` input rather than from `github.ref`.
#
# Required repository secrets (only used by the `release` job):
#   ANDROID_KEYSTORE_BASE64  — base64 of release.keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Optional repository secret (used by both `build` and `release`):
#   GOOGLE_SERVICES_JSON_BASE64  — base64 of frontend/android/app/google-services.json
#     needed for FCM push notifications. When missing the APK still builds
#     but `@capacitor/push-notifications` will fail to register at runtime.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'mobile/**'
      - '.github/workflows/mobile-release.yml'
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.9.0). Must already exist on the repo."
        required: true
        type: string
    # Declared explicitly so the caller can forward exactly these and nothing
    # else (`secrets: inherit` would hand over every secret in the repo).
    secrets:
      ANDROID_KEYSTORE_BASE64:
        description: "base64 of release.keystore — required to sign the release APK"
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      GOOGLE_SERVICES_JSON_BASE64:
        description: "base64 of google-services.json — optional, FCM push only"
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.9.0). Leave empty to only build a debug APK from the dispatched ref."
        required: false
        type: string
        default: ''

# Least-privilege default; the `release` job elevates to contents: write per-job.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build web bundle
        working-directory: frontend
        run: npm run build

      - name: Add Android platform if missing
        working-directory: frontend
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Inject google-services.json for FCM
        env:
          GSJ_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GSJ_B64" ]; then
            echo "$GSJ_B64" | base64 -d > frontend/android/app/google-services.json
            echo "google-services.json injected ($(wc -c < frontend/android/app/google-services.json) bytes)"
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set — FCM push will be unavailable in this build"
          fi

      - name: Sync Android versionName / versionCode from package.json
        run: |
          PKG_VERSION=$(node -p "require('./frontend/package.json').version")
          GRADLE_FILE=frontend/android/app/build.gradle
          # versionName → "X.Y.Z" from package.json
          sed -i "s/versionName \".*\"/versionName \"$PKG_VERSION\"/" "$GRADLE_FILE"
          # versionCode → monotonic counter based on the GitHub run number so
          # every CI build gets a unique increasing value (Play Store requires
          # strictly increasing versionCode across uploads).
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" "$GRADLE_FILE"
          grep -E "versionCode|versionName" "$GRADLE_FILE"

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: whatisup-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    needs: build
    # Run when a tag is in play: a v* tag push/dispatch (github.ref_type == tag)
    # or a workflow_call/dispatch that passes the `tag` input. A plain push to
    # main (debug CI build) leaves inputs.tag empty on a branch ref → skipped.
    if: ${{ github.ref_type == 'tag' || inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build web bundle
        working-directory: frontend
        run: npm run build

      - name: Sync Android project
        working-directory: frontend
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Inject google-services.json for FCM
        env:
          GSJ_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GSJ_B64" ]; then
            echo "$GSJ_B64" | base64 -d > frontend/android/app/google-services.json
            echo "google-services.json injected ($(wc -c < frontend/android/app/google-services.json) bytes)"
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set — FCM push will be unavailable in this build"
          fi

      - name: Sync Android versionName / versionCode from package.json
        run: |
          PKG_VERSION=$(node -p "require('./frontend/package.json').version")
          GRADLE_FILE=frontend/android/app/build.gradle
          # versionName → "X.Y.Z" from package.json
          sed -i "s/versionName \".*\"/versionName \"$PKG_VERSION\"/" "$GRADLE_FILE"
          # versionCode → monotonic counter based on the GitHub run number so
          # every CI build gets a unique increasing value (Play Store requires
          # strictly increasing versionCode across uploads).
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" "$GRADLE_FILE"
          grep -E "versionCode|versionName" "$GRADLE_FILE"

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > frontend/android/app/release.keystore

      - name: Build signed release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD

      - name: Attach APK to GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: frontend/android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
