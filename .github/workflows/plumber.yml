name: Plumber compliance

# Audits the GitHub Actions workflows for supply-chain hardening gaps
# (SHA-pinned actions, least-privilege permissions, dangerous triggers,
# mutable image tags, branch protection) against `.plumber.yaml`.
# Findings are uploaded to Code Scanning (Security tab).
#
# Hard gate: the repo scores 100% / grade A at introduction (all actions
# SHA-pinned, every workflow declares permissions, `main` is branch-protected),
# so this runs as a blocking gate (`soft-fail: false`, threshold 100%). Any
# regression — an unpinned action, a workflow missing a permissions block,
# a dangerous trigger — fails the check. To temporarily downgrade to
# report-only, set `soft-fail: "true"`.
#
# The grade is also published to the hosted badge service on every push to
# `main` (`score-push`), which is what the README's Plumber Score badge reads.
# That makes the repo name and its score public — deliberate, the repo is
# public anyway. Set `score-push: "false"` to stop publishing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plumber:
    name: Plumber scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to Code Scanning
      id-token: write          # OIDC token for score-push (no secret involved)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: getplumber/plumber@3feac69e925e9771f8a495f4177af754d568c1ad  # v0.4.48
        with:
          config-file: .plumber.yaml
          threshold: "100"
          score: "true"
          upload-sarif: "true"
          soft-fail: "false"   # blocking gate — see header note
          # Only the default branch's score is displayed by the badge service,
          # and a fork PR cannot mint the OIDC token — so publish on push only.
          score-push: ${{ github.event_name == 'push' }}
