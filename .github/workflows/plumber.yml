name: Plumber compliance

# Audits the GitHub Actions workflows for supply-chain hardening gaps
# (SHA-pinned actions, least-privilege permissions, dangerous triggers,
# mutable image tags, branch protection) against `.plumber.yaml`.
# Findings are uploaded to Code Scanning (Security tab).
#
# Rollout: introduced in REPORT mode (`soft-fail: true`) so it never blocks
# merges while findings are triaged. Once `main` is branch-protected and the
# grade is green, flip `soft-fail` to "false" to make it a hard gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write   # upload SARIF to Code Scanning

jobs:
  plumber:
    name: Plumber scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: getplumber/plumber@4d73d009cd2d4c1762d8673331f30c8d0c82e4c8  # v0.3.60
        with:
          config-file: .plumber.yaml
          threshold: "100"
          score: "true"
          upload-sarif: "true"
          soft-fail: "true"   # report-only for now; see header note
