name: Release

# Triggers:
# - `push: tags` — automatic when a `vX.Y.Z` tag is pushed manually.
# - `workflow_dispatch` — manual fallback for tags created via API by
#   release-please (which historically did not trigger `on: push: tags`).
#   Pass the existing tag (e.g. `v1.9.0`) as the `tag` input; the workflow
#   checks out that ref and treats it exactly like the push-triggered run.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.9.0). Must already exist on the repo."
        required: true
        type: string

# `RELEASE_TAG` is the single source of truth for the version being released,
# whether the run was triggered by a tag push or by manual dispatch.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ── Run CI checks before releasing ──────────────────────────────────────────
  ci-gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  # ── Extract changelog for this version ──────────────────────────────────────
  release-notes:
    name: Extract release notes
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.extract.outputs.notes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Extract section from CHANGELOG.md
        id: extract
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${TAG#v}"
          # Extract the block between ## [X.Y.Z] and the next ## [
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ── Build & push Docker images ───────────────────────────────────────────────
  docker:
    name: Build & push ${{ matrix.image_name }}
    runs-on: ubuntu-latest
    needs: [release-notes, ci-gate]
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - image_name: whatisup-server
            dockerfile: server/Dockerfile
            context: server
          - image_name: whatisup-probe
            dockerfile: probe/Dockerfile
            context: probe
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Compute version tags
        id: ver
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${TAG#v}"
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1-2)
          IS_PRERELEASE="false"
          case "$VERSION" in *-*) IS_PRERELEASE="true" ;; esac
          {
            echo "version=$VERSION"
            echo "major_minor=$MAJOR_MINOR"
            echo "is_prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.major_minor }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.is_prerelease == 'false' }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Create GitHub Release ────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-notes, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "WhatIsUp ${{ env.RELEASE_TAG }}"
          body: ${{ needs.release-notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc') || contains(env.RELEASE_TAG, '-beta') || contains(env.RELEASE_TAG, '-alpha') }}
          generate_release_notes: false
