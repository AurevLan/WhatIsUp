name: Release

# Triggers:
# - `push: tags` — automatic when a `vX.Y.Z` tag is pushed manually.
# - `workflow_call` — invoked by release-please.yml right after it creates a
#   release. The release-please tag is created with GITHUB_TOKEN and therefore
#   never fires `on: push: tags`; the caller passes the new `tag` instead.
# - `workflow_dispatch` — manual fallback. Pass the existing tag as `tag`; the
#   workflow checks out that ref and treats it exactly like a tag push.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.9.0). Must already exist on the repo."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.9.0). Must already exist on the repo."
        required: true
        type: string

# `RELEASE_TAG` is the single source of truth for the version being released,
# whether the run was triggered by a tag push or by manual dispatch.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

# Least-privilege default. Jobs that need more elevate per-job:
# `docker` → packages: write, `github-release` → contents: write.
permissions:
  contents: read

jobs:
  # ── Run CI checks before releasing ──────────────────────────────────────────
  ci-gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  # ── Extract changelog for this version ──────────────────────────────────────
  release-notes:
    name: Extract release notes
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.extract.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Extract section from CHANGELOG.md
        id: extract
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${TAG#v}"
          # Extract the block between ## [X.Y.Z] and the next ## [
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ── Build & push Docker images ───────────────────────────────────────────────
  docker:
    name: Build & push ${{ matrix.image_name }}
    runs-on: ubuntu-latest
    needs: [release-notes, ci-gate]
    permissions:
      packages: write
      id-token: write  # Cosign keyless (Fulcio/Rekor): mints the OIDC token this job signs with
    strategy:
      matrix:
        include:
          - image_name: whatisup-server
            dockerfile: server/Dockerfile
            context: server
          - image_name: whatisup-probe
            dockerfile: probe/Dockerfile
            context: probe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Compute version tags
        id: ver
        env:
          TAG: ${{ env.RELEASE_TAG }}
          OWNER: ${{ github.repository_owner }}
        run: |
          VERSION="${TAG#v}"
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1-2)
          IS_PRERELEASE="false"
          case "$VERSION" in *-*) IS_PRERELEASE="true" ;; esac
          # An OCI reference must be lowercase, but `github.repository_owner`
          # keeps the account's original casing ("AurevLan"). metadata-action
          # lowercases its own `images:` input, which is why build and push
          # were fine while every raw interpolation below — cosign, sbom-action
          # — died on "could not parse reference" (v1.26.0).
          {
            echo "version=$VERSION"
            echo "major_minor=$MAJOR_MINOR"
            echo "is_prerelease=$IS_PRERELEASE"
            echo "owner_lc=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ghcr.io/${{ steps.ver.outputs.owner_lc }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.major_minor }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.is_prerelease == 'false' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      # D-2: sign the digest build-push-action just pushed, never a tag — a tag
      # is mutable and a signature on it would stop meaning anything the moment
      # the tag moves.
      - name: Sign image (Cosign, keyless)
        env:
          IMAGE_DIGEST: ghcr.io/${{ steps.ver.outputs.owner_lc }}/${{ matrix.image_name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"

      # D-4/D-5: self-check right after signing — under workflow_call the
      # certificate identity is the *called* workflow at the ref it was called
      # from (release.yml@refs/heads/main via release-please, not @refs/tags/…).
      # A malformed identity must fail the release here, not ship an
      # unverifiable signature nobody notices.
      - name: Verify image signature (self-check)
        env:
          IMAGE_DIGEST: ghcr.io/${{ steps.ver.outputs.owner_lc }}/${{ matrix.image_name }}@${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/AurevLan/WhatIsUp/\.github/workflows/release\.yml@refs/(heads/main|tags/v.*)$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_DIGEST"

      # D-3: SPDX SBOM for the humans auditing a release without pulling the
      # image — uploaded as a build artifact, attached to the GitHub Release
      # by the github-release job below.
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: ghcr.io/${{ steps.ver.outputs.owner_lc }}/${{ matrix.image_name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.image_name }}.spdx.json
          artifact-name: sbom-${{ matrix.image_name }}.spdx.json
          upload-release-assets: false

      # Sign the same SBOM as a Cosign attestation, tied to the same OIDC
      # identity as the image signature above — this is what makes
      # `cosign verify-attestation` (D-3) meaningful: the `sbom: true` +
      # `provenance: mode=max` attachment above is BuildKit's own unsigned
      # attestation, readable with `docker buildx imagetools inspect`, but not
      # something Cosign can verify a signer identity against on its own.
      - name: Attest SBOM (Cosign, keyless)
        env:
          IMAGE_DIGEST: ghcr.io/${{ steps.ver.outputs.owner_lc }}/${{ matrix.image_name }}@${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate sbom-${{ matrix.image_name }}.spdx.json \
            --type spdxjson \
            "$IMAGE_DIGEST"

      - name: Verify SBOM attestation (self-check)
        env:
          IMAGE_DIGEST: ghcr.io/${{ steps.ver.outputs.owner_lc }}/${{ matrix.image_name }}@${{ steps.build.outputs.digest }}
        run: |
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp '^https://github\.com/AurevLan/WhatIsUp/\.github/workflows/release\.yml@refs/(heads/main|tags/v.*)$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_DIGEST" > /dev/null

  # ── Create GitHub Release ────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-notes, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: sbom-*.spdx.json
          path: sboms
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "WhatIsUp ${{ env.RELEASE_TAG }}"
          body: ${{ needs.release-notes.outputs.notes }}
          files: sboms/*.spdx.json
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc') || contains(env.RELEASE_TAG, '-beta') || contains(env.RELEASE_TAG, '-alpha') }}
          generate_release_notes: false
