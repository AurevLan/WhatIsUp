name: Dependency security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"   # Every Monday at 08:00 UTC

# Least-privilege default; audit jobs only read the repo.
permissions:
  contents: read

jobs:
  pip-audit-server:
    name: pip-audit (server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install server + pip-audit
        # Upgrade pip first: runner image ships pip 26.1.1 (PYSEC-2026-196),
        # patched in 26.1.2 — pin the fix instead of ignoring the vuln.
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -e ".[dev]" pip-audit
      - name: Audit server dependencies
        # CVE-2026-4539 (pygments): no fix release yet — revisit when pygments > 2.19.2
        # CVE-2026-3219 / CVE-2026-6357 (pip in runner image): upstream pip itself,
        # not a project dependency we ship — pip is upgraded above to a patched build.
        run: pip-audit --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357

  pip-audit-probe:
    name: pip-audit (probe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: probe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install probe + pip-audit
        # Upgrade pip first: runner image ships pip 26.1.1 (PYSEC-2026-196),
        # patched in 26.1.2 — pin the fix instead of ignoring the vuln.
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -e ".[dev]" pip-audit
      - name: Audit probe dependencies
        # CVE-2026-4539 (pygments): no fix release yet — revisit when pygments > 2.19.2
        # CVE-2026-3219 / CVE-2026-6357 (pip in runner image): upstream pip itself,
        # not a project dependency we ship — pip is upgraded above to a patched build.
        run: pip-audit --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357

  npm-audit-frontend:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
