name: Dependency security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"   # Every Monday at 08:00 UTC

jobs:
  pip-audit-server:
    name: pip-audit (server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
      - name: Install server + pip-audit
        run: pip install -e ".[dev]" pip-audit
      - name: Audit server dependencies
        # CVE-2026-4539 (pygments): no fix release yet — revisit when pygments > 2.19.2
        # CVE-2026-3219 / CVE-2026-6357 (pip 26.0.1 in runner image): upstream pip
        # itself, not a project dependency we ship. Revisit when GH Actions ships
        # pip > 26.1.
        run: pip-audit --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357

  pip-audit-probe:
    name: pip-audit (probe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: probe
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
      - name: Install probe + pip-audit
        run: pip install -e ".[dev]" pip-audit
      - name: Audit probe dependencies
        # CVE-2026-4539 (pygments): no fix release yet — revisit when pygments > 2.19.2
        # CVE-2026-3219 / CVE-2026-6357 (pip 26.0.1 in runner image): upstream pip
        # itself, not a project dependency we ship. Revisit when GH Actions ships
        # pip > 26.1.
        run: pip-audit --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357

  npm-audit-frontend:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
