# WhatIsUp — Stack complète
# Usage: docker compose --env-file .env up -d
#
# Variables requises dans .env (voir .env.example) :
#   POSTGRES_PASSWORD, REDIS_PASSWORD, SECRET_KEY, FERNET_KEY,
#   CORS_ALLOWED_ORIGINS
#
# On first boot, the server automatically:
#   - Creates admin@local with a random password (check: docker compose logs server)
#   - Registers Central-Probe and writes its API key to /probe-secrets/PROBE_API_KEY
#
# SSL: nginx/ssl/cert.pem + key.pem requis (générez-les avec deploy.sh ou openssl)
#
# Sonde co-localisée optionnelle :
#   PROBE_API_KEY=wiu_... docker compose --env-file .env --profile probe up -d probe

networks:
  backend:
    driver: bridge
    internal: true
  frontend:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    # Stock PostgreSQL defaults (shared_buffers=128MB, work_mem=4MB) are sized
    # for a toy database. check_results reaches multiple GB at the default 90-day
    # retention, so analytics queries re-read from disk on every call and sorts
    # spill to a temp file (measured: 1.4 GB read + external merge on a 90-day
    # history — plan_v2.md § A-0). Raise every knob via .env on a bigger host;
    # keep POSTGRES_MEM_LIMIT ≳ 3× shared_buffers.
    command: >
      postgres
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}
      -c work_mem=${POSTGRES_WORK_MEM:-16MB}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whatisup}
      POSTGRES_USER: ${POSTGRES_USER:-whatisup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT:-1g}
          cpus: "${POSTGRES_CPU_LIMIT:-1.0}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatisup}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    volumes:
      # `shared` reste réservé au serveur : il porte le mot de passe superadmin
      # du premier boot. Seule la clé de la sonde transite par `probe_secrets`,
      # le seul volume monté dans la sonde (audit F15).
      - shared:/shared
      - probe_secrets:/probe-secrets
      - ./extension:/app/extension:ro
      # FCM service account (gitignored). The path is configured in env so the
      # server falls back gracefully when the file is missing.
      - ./mobile/.secrets/firebase-service-account.json:/run/secrets/fcm.json:ro
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-whatisup}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-whatisup}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      FERNET_KEY: ${FERNET_KEY:?FERNET_KEY must be set}
      # Set only during a FERNET_KEY rotation (old key(s), comma-separated);
      # empty otherwise. See SECURITY.md §7. Required so the container can
      # decrypt secrets still encrypted with the old key until rotation completes.
      FERNET_KEY_PREVIOUS: ${FERNET_KEY_PREVIOUS:-}
      ENVIRONMENT: production
      DEBUG: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      AUTO_REGISTER_PROBE: "true"
      PROBE_LOCATION: ${PROBE_LOCATION:-Central Server}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-true}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CONTACT_EMAIL: ${VAPID_CONTACT_EMAIL:-admin@example.com}
      # FCM (native mobile push) — set FCM_SERVICE_ACCOUNT_PATH to a mounted
      # JSON file or pass FCM_SERVICE_ACCOUNT_JSON inline. Empty = disabled.
      FCM_SERVICE_ACCOUNT_PATH: ${FCM_SERVICE_ACCOUNT_PATH:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
    networks:
      - backend
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/whatisup.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend
    depends_on:
      server:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"

  # Sonde centrale co-localisée (optionnelle — profil "central-probe")
  # Activée automatiquement par deploy.sh option 1
  probe-local:
    build:
      context: ./probe
    volumes:
      # Uniquement la clé d'API : la sonde exécute des checks sortants contre
      # des cibles hostiles, elle ne doit pas pouvoir lire /shared (audit F15).
      - probe_secrets:/probe-secrets:ro
    environment:
      CENTRAL_API_URL: http://server:8000
      PROBE_API_KEY: ${PROBE_API_KEY:-}
      PROBE_NAME: "Central-Probe"
      PROBE_LOCATION: ${PROBE_LOCATION:-Central Server}
      HEARTBEAT_INTERVAL: "15"
    dns:
      - ${PROBE_DNS_1:-8.8.8.8}
      - ${PROBE_DNS_2:-8.8.4.4}
    networks:
      - frontend
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    shm_size: '256mb'
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "2.0"
    profiles:
      - central-probe

  # Sonde co-localisée optionnelle (profil "probe")
  probe:
    build:
      context: ./probe
    environment:
      CENTRAL_API_URL: http://server:8000
      PROBE_API_KEY: ${PROBE_API_KEY:-}
      PROBE_NAME: ${PROBE_NAME:-local-probe}
      PROBE_LOCATION: ${PROBE_LOCATION:-Local}
      HEARTBEAT_INTERVAL: "30"
      MAX_CONCURRENT_CHECKS: "10"
    dns:
      - ${PROBE_DNS_1:-8.8.8.8}
      - ${PROBE_DNS_2:-8.8.4.4}
    # Opt-in discovery source "docker" (plan D) — commented out on purpose.
    # Mounting the Docker socket grants this container read access to every
    # container on the host (image, name, labels, published ports): treat it
    # as a privileged capability, not a default. Never enable it unless you
    # actually intend to run a `docker` discovery source on this probe. See
    # README.md § Automatic discovery / plan_discovery.md § Sécurité.
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - frontend
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    shm_size: '256mb'
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "2.0"
    profiles:
      - probe

  # ── Recette / tests d'intégration (profil "recette") ─────────────────────
  # Usage: docker compose --env-file .env --profile recette run --rm recette
  recette:
    build:
      context: ./server
      dockerfile: Dockerfile.recette
    environment:
      RECETTE_BASE_URL: http://server:8000
      ADMIN_EMAIL: ${RECETTE_EMAIL:-recette@test.local}
      ADMIN_PASSWORD: ${RECETTE_PASSWORD:-RecettePass1!}
    networks:
      - frontend
    depends_on:
      server:
        condition: service_healthy
    profiles:
      - recette

volumes:
  postgres_data:
  redis_data:
  shared:
  probe_secrets:
