upstream api {
    server server:8000;
}

upstream frontend {
    server frontend:80;
}

# Rate limiting (must be at http context level)
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss: ws: https://fcm.googleapis.com; worker-src 'self'; frame-ancestors 'none'" always;

    # API + WebSocket
    #
    # X-Forwarded-For is *overwritten* with $remote_addr, never appended with
    # $proxy_add_x_forwarded_for: this is the trust boundary, and everything
    # the client sent in that header is a claim it made about itself. Appending
    # kept the client's value leftmost, which is exactly the entry the backend
    # reads — per-IP rate limits (login throttle included) and audit-log source
    # IPs were forgeable by rotating a header (audit F13/F14).
    # Behind an upstream load balancer, replace $remote_addr with the address
    # that LB reports and add its range to TRUSTED_PROXY_IPS.
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Same treatment for the WebSocket route: without an explicit
    # proxy_set_header, nginx forwards the client's own X-Forwarded-For /
    # X-Forwarded-Proto untouched, and ws.py reads websocket.client.host.
    location /ws/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # index.html must never be cached — the main JS bundle is hashed but the
    # HTML that references it isn't. Without this, rebuilds require users to
    # hard-refresh before they pick up the new bundle / CSP changes.
    location = /index.html {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location = / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Frontend (SPA)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        # SPA fallback
        proxy_intercept_errors on;
        error_page 404 = @spa;
    }

    location @spa {
        proxy_pass http://frontend;
        rewrite ^ /index.html break;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
