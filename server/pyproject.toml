[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whatisup-server"
version = "1.23.0"
description = "WhatIsUp — central monitoring server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "WhatIsUp Contributors" }]

dependencies = [
    # Web framework
    # Le bug _IncludedRouter (routing cassé en 0.137-0.138, AttributeError côté
    # Starlette) est corrigé depuis 0.139 : plus aucun blocage connu. Le cap <0.140
    # n'est donc qu'une borne haute prudente, à réévaluer/relever librement.
    "fastapi>=0.125.0,<0.142",
    "starlette>=0.49.1",
    "uvicorn[standard]>=0.32.0,<0.53",

    # Database
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30.0,<0.32",
    "alembic>=1.18.4,<1.20",

    # Cache / pub-sub
    # !=8.0.0 : cette unique version force socket_timeout=5s sur le read bloquant
    # du pubsub → le subscriber WS idle (api/v1/ws.py:_redis_subscriber) crashe
    # toutes les 5s (TimeoutError, reproduit empiriquement contre un vrai redis).
    # Corrigé dès 8.0.1 : le read bloquant passe timeout=math.inf et n'hérite plus
    # de socket_timeout (celui-ci ne régit plus que reconnect/AUTH/resubscribe).
    # 8.0.1+ est donc sûr ; on garde <9 mais on exclut la 8.0.0 connue cassante.
    "redis[hiredis]>=5.2.0,!=8.0.0,<9",

    # Configuration
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.13.1,<3",
    "python-dotenv>=1.2.2,<2",

    # Authentication
    "pyjwt>=2.12.0,<3",
    "bcrypt>=5.0.0,<6",
    "pyotp>=2.9.0,<3",
    "python-multipart>=0.0.26,<0.1",
    "email-validator>=2.2.0,<3",

    # Rate limiting
    "slowapi>=0.1.9,<0.2",

    # SSL certificate parsing
    "cryptography>=50.0.0,<51",

    # Async email
    "aiosmtplib>=3.0.0,<6",

    # HTTP client (webhook/telegram dispatch + probe validation)
    "httpx>=0.28.0,<0.29",

    # Web Push (VAPID)
    "pywebpush>=1.9.0,<3",

    # Structured logging
    "structlog>=25.1.0,<27",

    # Observability
    "prometheus-fastapi-instrumentator>=7.1.0,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10",
    "pytest-asyncio>=0.25.0,<1.5",
    "pytest-cov>=6.0.0,<8",
    "aiosqlite>=0.20.0,<0.23",
    "ruff>=0.15.10,<0.17",
    "mypy>=1.20.1,<3",
    "pip-audit>=2.8.0,<3",
    "fakeredis>=2.26.0,<3",
]

[project.scripts]
whatisup-server = "whatisup.main:main"

[tool.hatch.build.targets.wheel]
packages = ["whatisup"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# `server/alembic/` is the migrations directory, not the `alembic` library. Older
# ruff versions see the directory and classify the import as first-party, newer
# ones (no `__init__.py`) as third-party — the two then disagree on import order
# and fight over the same file. Say it explicitly: the imports are the library.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Alembic migrations use Union[...] and typing imports from autogenerate template
"alembic/versions/*.py" = ["UP007", "UP035", "F401", "I001", "E501"]
# Recette script: long HTTP URL strings are fine in a one-off test runner
"tests/recette.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
